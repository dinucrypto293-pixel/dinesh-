<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d46"><meta name="description" content="A simple daily farm ledger for sales, expenses, flock records and stock.">
<title>Farm Daily Book</title>
<style>
:root{color-scheme:light;--bg:#f3f4ee;--card:#fff;--ink:#1d2a22;--mut:#66726a;--line:#dce0d4;--green:#2f5d46;--soft:#e2ece5;--red:#b3402f;--redbg:#f7e3de;--gold:#e0a82e}*{box-sizing:border-box}body{margin:0 auto;padding:14px 14px 44px;max-width:620px;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif}h1{font-size:22px;margin:0;font-weight:800}h2{font-size:17px;margin:20px 0 8px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.topr{display:flex;gap:6px;align-items:center}.top input{width:auto}input,select,button{font:inherit;color:inherit}input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}.mini,.tab{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 11px;font-weight:700}.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 6px}.tab{white-space:nowrap;flex:1 0 auto}.tab.on{background:var(--ink);color:var(--bg)}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}.hero{background:var(--green);color:white;border-radius:10px;padding:16px;margin:12px 0}.hero small{opacity:.85;font-weight:600}.big{font-size:38px;line-height:1.15;font-weight:800}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.w{grid-column:1/-1}.go{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px;font-weight:800}.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.mut,.empty{color:var(--mut);font-size:14px}.neg{color:var(--red)}.x{background:none;border:0;color:var(--ink);font-size:20px;font-weight:800;padding:0 6px}.alert{background:var(--redbg);color:var(--red);border-radius:8px;padding:10px;margin:8px 0;font-size:14px}.adj{display:flex;gap:6px;margin-top:8px}.adj input{width:100px}.adj button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:7px 10px}.chk{display:flex;align-items:center;gap:8px}.chk input{width:20px;height:20px}.done{text-decoration:line-through;color:var(--mut)}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:right;border-bottom:1px solid var(--line);padding:8px 3px}td:first-child,th:first-child{text-align:left}th{color:var(--mut)}#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:var(--ink);color:white;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:5;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}#toast.warn{background:var(--red)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#131a16;--card:#1c2621;--ink:#eef2ec;--mut:#9aa89f;--line:#2e3c34;--green:#315c42;--soft:#24382d;--red:#e98a77;--redbg:#3b2420}}
</style></head>
<body><header class="top"><h1>Farm Daily Book</h1><div class="topr"><input type="date" id="day" aria-label="Day" onchange="setDay(this.value)"><button class="mini" onclick="goToday()">Today</button></div></header><main id="app"></main><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const KEY='farmDailyBook.v2',today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)},id=()=>Math.random().toString(36).slice(2,10),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(n)?n:0},money=v=>Math.round(num(v)*100)/100,fmt=v=>money(v).toLocaleString('en-IN',{maximumFractionDigits:2}),rs=v=>(money(v)<0?'−':'')+'₹'+fmt(Math.abs(money(v))),qty=v=>fmt(v),blank=()=>({sales:[],exp:[],stock:[],records:{},tasks:['Collect eggs','Refill water','Check feed','Look for sick birds','Clean pens'],done:{},vax:[]});
let data=blank(),day=today(),tab='Home',span=14;
try{const old=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('farm')||'null');if(old&&typeof old==='object')data={...blank(),...old,records:old.records||old.rec||{},tasks:Array.isArray(old.tasks)?old.tasks.map(x=>typeof x==='string'?x:x.t||''):blank().tasks}}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{say('Could not save on this device','warn')}}function say(s,k=''){const e=$('#toast');e.textContent=s;e.className='show '+k;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.className='',2400)}function setDay(v){if(v){day=v;draw()}}function goToday(){day=today();tab='Home';draw()}function setTab(v){tab=v;draw()}function val(id){return $('#'+id)?.value||''}function sums(list,d){return money(list.filter(x=>x.d===d).reduce((a,x)=>a+money(x.amt),0))}function sales(d){return sums(data.sales,d)}function spent(d){return sums(data.exp,d)}function field(id,ph,type='text'){return `<input id="${id}" type="${type}" placeholder="${ph}" ${type==='text'?'inputmode="decimal"':''}>`}function remove(kind,key){data[kind]=data[kind].filter(x=>x.id!==key);save();draw();say('Entry deleted')}
function addSale(){let a=money(val('sa'));if(a<=0)return say('Enter a sale amount','warn');data.sales.push({id:id(),d:day,item:val('si')||'Eggs',qty:money(val('sq')),amt:a});save();draw();say('Sale saved')}
function addExpense(){let a=money(val('ea'));if(a<=0)return say('Enter an expense amount','warn');data.exp.push({id:id(),d:day,cat:val('ec')||'Other',amt:a,note:val('en')});save();draw();say('Expense saved')}
function addStock(){let name=val('sn').trim(),n=money(val('sk'));if(!name)return say('Enter an item name','warn');const item={id:id(),name,qty:Math.max(0,n),unit:val('su')||'kg',low:money(val('sl'))};data.stock.push(item);let cost=money(val('sc'));if(cost>0)data.exp.push({id:id(),d:day,cat:'Feed',amt:cost,note:'Bought '+name});save();draw();say('Stock saved')}
function adjust(key,dir){let s=data.stock.find(x=>x.id===key),n=money(val('a'+key));if(!s||n<=0)return say('Enter a quantity','warn');if(dir<0&&n>s.qty)return say('Not enough stock','warn');s.qty=money(s.qty+dir*n);save();draw();say('Stock updated')}
function saveRecord(){data.records[day]={eggs:Math.max(0,Math.round(num(val('eg')))),lost:Math.max(0,Math.round(num(val('lost')))),feed:Math.max(0,money(val('feed'))),sick:Math.max(0,Math.round(num(val('sick')))),note:val('note')};save();draw();say('Flock record saved')}
function addTask(){let t=val('task').trim();if(!t)return;data.tasks.push(t);save();draw()}function toggleTask(i){let a=data.done[day]||(data.done[day]=[]);a.includes(i)?a.splice(a.indexOf(i),1):a.push(i);save();draw()}
function addVax(){let n=val('vname').trim(),d=val('vdate');if(!n||!d)return say('Enter a name and due date','warn');data.vax.push({id:id(),name:n,due:d,done:false});save();draw()}function toggleVax(key){const v=data.vax.find(x=>x.id===key);if(v)v.done=!v.done;save();draw()}
function download(name,text,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){download('farm-backup-'+today()+'.json',JSON.stringify(data,null,2),'application/json')}function restore(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0;data={...blank(),...d};save();draw();say('Backup restored')}catch{say('Invalid backup file','warn')}el.value=''};r.readAsText(f)}
function home(){let a=sales(day),b=spent(day),r=data.records[day]||{},done=data.done[day]||[],month=day.slice(0,7),ms=money(data.sales.filter(x=>x.d.startsWith(month)).reduce((s,x)=>s+money(x.amt),0)),me=money(data.exp.filter(x=>x.d.startsWith(month)).reduce((s,x)=>s+money(x.amt),0));return `<div class="hero"><small>Cash profit · ${day}</small><div class="big">${rs(a-b)}</div><div class="row"><span>Sales ${rs(a)}</span><span>Expenses ${rs(b)}</span></div></div><div class="card"><div class="li"><span class="mut">Month so far</span><span>${rs(ms)} in · ${rs(me)} out</span></div><div class="li"><b>Month profit</b><b>${rs(ms-me)}</b></div><p class="mut">Profit uses recorded sales and expenses. A feed purchase is counted when paid.</p></div><h2>Flock today</h2><div class="card f">${field('eg','Eggs collected')}${field('lost','Birds lost')}${field('feed','Feed used (kg)')}${field('sick','Sick birds')}<input id="note" class="w" placeholder="Notes (optional)" value="${esc(r.note||'')}"><button class="go w" onclick="saveRecord()">Save flock record</button></div><h2>Daily checklist (${done.length}/${data.tasks.length})</h2><div class="card">${data.tasks.map((t,i)=>`<div class="li"><label class="chk"><input type="checkbox" ${done.includes(i)?'checked':''} onchange="toggleTask(${i})"><span class="${done.includes(i)?'done':''}">${esc(t)}</span></label><button class="x" onclick="data.tasks.splice(${i},1);save();draw()" aria-label="Remove task">×</button></div>`).join('')}<div class="f"><input id="task" placeholder="Add daily task"><button class="go" onclick="addTask()">Add</button></div></div>`}
function ledger(){let sl=data.sales.filter(x=>x.d===day).slice().reverse(),ex=data.exp.filter(x=>x.d===day).slice().reverse();return `<h2>Record a sale · ${day}</h2><div class="card f"><select id="si" class="w"><option>Eggs</option><option>Birds</option><option>Manure</option><option>Other</option></select>${field('sq','Quantity')}${field('sa','Total amount ₹')}<button class="go w" onclick="addSale()">Save sale</button></div><div class="card">${sl.length?sl.map(x=>`<div class="li"><span>${esc(x.item)} ${x.qty?'· '+qty(x.qty):''}</span><b>${rs(x.amt)} <button class="x" onclick="remove('sales','${x.id}')">×</button></b></div>`).join(''):'<div class="empty">No sales recorded today.</div>'}<div class="li"><b>Sales today</b><b>${rs(sales(day))}</b></div></div><h2>Record an expense</h2><div class="card f"><select id="ec"><option>Feed</option><option>Medicine</option><option>Labour</option><option>Water and power</option><option>Repairs</option><option>Other</option></select>${field('ea','Amount ₹')}<input id="en" class="w" placeholder="Note (optional)"><button class="go w" onclick="addExpense()">Save expense</button></div><div class="card">${ex.length?ex.map(x=>`<div class="li"><span>${esc(x.cat)}<div class="mut">${esc(x.note||'')}</div></span><b>${rs(-x.amt)} <button class="x" onclick="remove('exp','${x.id}')">×</button></b></div>`).join(''):'<div class="empty">No expenses recorded today.</div>'}<div class="li"><b>Profit today</b><b>${rs(sales(day)-spent(day))}</b></div></div>`}
function stock(){return `<h2>Feed stock</h2><div class="card">${data.stock.length?data.stock.map(s=>`<div class="li" style="display:block"><div class="row"><b>${esc(s.name)}</b><span>${qty(s.qty)} ${esc(s.unit)} <button class="x" onclick="remove('stock','${s.id}')">×</button></span></div><div class="mut">Alert at ${qty(s.low)} ${esc(s.unit)}</div><div class="adj"><input id="a${s.id}" placeholder="Quantity" inputmode="decimal"><button onclick="adjust('${s.id}',-1)">Use</button><button onclick="adjust('${s.id}',1)">Add</button></div></div>`).join(''):'<div class="empty">No stock items yet.</div>'}</div><h2>Add feed or supplies</h2><div class="card f"><input id="sn" class="w" placeholder="Item name">${field('sk','Quantity')}<input id="su" placeholder="Unit (kg, bags)">${field('sl','Low-stock alert')}${field('sc','Purchase cost ₹ (optional)')}<button class="go w" onclick="addStock()">Save item</button></div>`}
function vaccines(){return `<h2>Vaccinations</h2><div class="card">${data.vax.length?data.vax.map(v=>`<div class="li"><span class="${v.done?'done':''}">${esc(v.name)}<div class="mut">Due ${esc(v.due)}</div></span><span><button class="mini" onclick="toggleVax('${v.id}')">${v.done?'Undo':'Done'}</button><button class="x" onclick="remove('vax','${v.id}')">×</button></span></div>`).join(''):'<div class="empty">No vaccinations added yet.</div>'}</div><h2>Add vaccination</h2><div class="card f"><input id="vname" class="w" placeholder="Vaccine name"><input id="vdate" type="date" class="w"><button class="go w" onclick="addVax()">Save vaccination</button></div>`}
function history(){let rows='';for(let i=span-1;i>=0;i--){let d=new Date(day+'T12:00:00');d.setDate(d.getDate()-i);let x=d.toISOString().slice(0,10),a=sales(x),b=spent(x);rows+=`<tr><td>${x.slice(5)}</td><td>${rs(a)}</td><td>${rs(b)}</td><td>${rs(a-b)}</td></tr>`}return `<h2>Last ${span} days</h2><div class="row">${[7,14,30].map(n=>`<button class="mini" onclick="span=${n};draw()">${n} days</button>`).join('')}</div><div class="card"><table><tr><th>Day</th><th>Sales</th><th>Spent</th><th>Profit</th></tr>${rows}</table></div><h2>Recent flock records</h2><div class="card"><table><tr><th>Day</th><th>Eggs</th><th>Lost</th><th>Feed kg</th><th>Sick</th></tr>${Object.keys(data.records).sort().reverse().slice(0,14).map(d=>{let r=data.records[d];return `<tr><td>${d.slice(5)}</td><td>${r.eggs||0}</td><td>${r.lost||0}</td><td>${qty(r.feed||0)}</td><td>${r.sick||0}</td></tr>`}).join('')}</table></div><h2>Backup and restore</h2><div class="card f"><button class="go" onclick="backup()">Download backup</button><label class="go alt" style="text-align:center">Restore backup<input type="file" accept="application/json,.json" onchange="restore(this)" hidden></label></div>`}
function draw(){const d=$('#day');d.value=day;const pages={Home:home,Sales:ledger,Stock:stock,Vaccines:vaccines,History:history};$('#app').innerHTML=`<nav class="tabs">${Object.keys(pages).map(t=>`<button class="tab ${tab===t?'on':''}" onclick="setTab('${t}')">${t}</button>`).join('')}</nav>${pages[tab]()}`}draw();
</script></body></html>
